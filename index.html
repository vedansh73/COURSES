<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>App Portal</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --danger: #ef4444;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .container.dashboard-mode {
      max-width: 800px;
    }

    h1, h2 {
      margin-bottom: 8px;
      font-size: 1.5rem;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.875rem;
      margin-bottom: 6px;
      color: var(--text-muted);
    }

    input[type="password"] {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="password"]:focus {
      border-color: var(--accent);
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: #000;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s;
    }

    .btn:hover {
      background: var(--accent-hover);
    }

    .btn-danger {
      background: var(--danger);
      color: #fff;
    }

    .btn-danger:hover {
      background: #dc2626;
    }

    .error-msg {
      color: var(--danger);
      font-size: 0.875rem;
      margin-top: 12px;
      display: none;
    }

    .hidden {
      display: none !important;
    }

    /* Dashboard Layout */
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    @media (min-width: 640px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .card {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 16px;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="container" id="appContainer">
    <!-- LOGIN VIEW -->
    <div id="loginView">
      <h1>Welcome Back</h1>
      <p class="subtitle">Enter your password to access the portal</p>
      
      <form id="loginForm" onsubmit="return false;">
        <div class="form-group">
          <label for="passwordInput">Password</label>
          <input type="password" id="passwordInput" placeholder="Enter password..." autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn" id="loginBtn">Unlock Access</button>
        <div id="errorMsg" class="error-msg">Incorrect password. Please try again.</div>
      </form>
    </div>

    <!-- DASHBOARD VIEW -->
    <div id="dashboardView" class="hidden">
      <div class="dashboard-header">
        <h2>Dashboard</h2>
        <button class="btn btn-danger" id="logoutBtn" style="width: auto; padding: 8px 16px;">Logout</button>
      </div>
      
      <div class="grid">
        <div class="card">
          <h3>Status</h3>
          <p class="subtitle" style="margin-top: 8px; margin-bottom: 0;">Session authenticated successfully via cryptographic validation.</p>
        </div>
        <div class="card">
          <h3>Actions</h3>
          <p class="subtitle" style="margin-top: 8px; margin-bottom: 0;">All links and system features are online.</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    /**
     * CONFIGURATION & CONSTANTS
     * Cryptographic SHA-256 hash of the valid password.
     * To change the password, replace VALIDATION_HASH with the SHA-256 hash of your new password.
     * Default password below is: "admin123"
     */
    const VALIDATION_HASH = "240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9";
    const SESSION_KEY = "portal_auth_session";

    // DOM Elements
    const appContainer = document.getElementById('appContainer');
    const loginView = document.getElementById('loginView');
    const dashboardView = document.getElementById('dashboardView');
    const loginForm = document.getElementById('loginForm');
    const passwordInput = document.getElementById('passwordInput');
    const errorMsg = document.getElementById('errorMsg');
    const logoutBtn = document.getElementById('logoutBtn');

    /**
     * SHA-256 Helper function using Web Crypto API (GitHub Pages / HTTPS Native)
     */
    async function hashString(str) {
      const encoder = new TextEncoder();
      const data = encoder.encode(str);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    /**
     * UI View Switcher
     */
    function renderView(isAuthenticated) {
      if (isAuthenticated) {
        loginView.classList.add('hidden');
        dashboardView.classList.remove('hidden');
        appContainer.classList.add('dashboard-mode');
      } else {
        dashboardView.classList.add('hidden');
        loginView.classList.remove('hidden');
        appContainer.classList.remove('dashboard-mode');
        passwordInput.value = '';
        errorMsg.style.display = 'none';
      }
    }

    /**
     * Session Initialization Check
     */
    function checkSession() {
      const savedToken = localStorage.getItem(SESSION_KEY);
      if (savedToken === VALIDATION_HASH) {
        renderView(true);
      } else {
        renderView(false);
      }
    }

    /**
     * Form Submission Handler
     */
    async function handleLogin(e) {
      e.preventDefault();
      errorMsg.style.display = 'none';
      
      const inputPassword = passwordInput.value;
      if (!inputPassword) return;

      try {
        const computedHash = await hashString(inputPassword);
        
        if (computedHash === VALIDATION_HASH) {
          localStorage.setItem(SESSION_KEY, VALIDATION_HASH);
          renderView(true);
        } else {
          errorMsg.style.display = 'block';
        }
      } catch (err) {
        console.error("Hash calculation failed:", err);
        errorMsg.textContent = "Secure hash calculation failed. Ensure HTTPS is enabled.";
        errorMsg.style.display = 'block';
      }
    }

    /**
     * Logout Handler
     */
    function handleLogout() {
      localStorage.removeItem(SESSION_KEY);
      renderView(false);
    }

    // Event Listeners
    loginForm.addEventListener('submit', handleLogin);
    logoutBtn.addEventListener('click', handleLogout);

    // Initial Execution
    document.addEventListener('DOMContentLoaded', checkSession);
  </script>
</body>
</html>
